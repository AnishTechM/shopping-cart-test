<nav class="navbar">
  <div class="navbar__logo">
    <a routerLink="/">
      <span>MyStore</span>
    </a>
  </div>

  <div class="navbar__search">
    <input
      type="text"
      placeholder="Search products..."
      [(ngModel)]="searchQuery"
      (keyup.enter)="onSearch()"
    />
    <button type="button" (click)="onSearch()" aria-label="Search">🔍</button>
  </div>

  <div class="navbar__actions">
    <button type="button" class="theme-toggle" (click)="themeService.toggleTheme()">
      @if (themeService.theme() === 'light') {
        🌙
      } @else {
        ☀️
      }
    </button>

    <a routerLink="/login" class="btn btn--outline">Log In</a>
    <a routerLink="/signup" class="btn btn--filled">Sign Up</a>
  </div>
</nav>
