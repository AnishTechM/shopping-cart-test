<ng-container>
  <h1>Login</h1>
  <form class="login__page" (submit)="$event.preventDefault(); login()">
    <div class="input__field">
      <input type="email" placeholder="Enter Email" [formField]="loginForm.email" />
      @if (loginForm.email().touched()) {
        @for (error of loginForm.email().errors(); track error.kind) {
          <p>{{ error.message }}</p>
        }
      }

      <input type="password" placeholder="Enter Password" [formField]="loginForm.password" />
      @if (loginForm.password().touched()) {
        @for (error of loginForm.password().errors(); track error.kind) {
          <p>{{ error.message }}</p>
        }
      }
    </div>
    <button type="submit" [disabled]="loginForm().invalid()">Login</button>
  </form>
</ng-container>
