<div class="product-list">
  <h1 class="product-list__title">Products</h1>

  @if (errorMessage) {
    <p class="product-list__error">{{ errorMessage }}</p>
  }

  @if (!errorMessage && products.length === 0) {
    <p class="product-list__loading">Loading products...</p>
  }

  @if (!errorMessage && products.length > 0 && filteredProducts.length === 0) {
    <p class="product-list__empty">No products match your search.</p>
  }

  <div class="product-list__grid">
    @for (product of filteredProducts; track product.id) {
      <app-product-card [product]="product" (addToCart)="addToCart($event)" />
    }
  </div>
</div>
