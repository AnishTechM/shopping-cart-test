<nav class="navbar">
  <div class="navbar__logo">
    <a routerLink="/">
      <span>MyStore</span>
    </a>
  </div>

  <div class="navbar__search">
    <input
      type="text"
      placeholder="Search products..."
      [(ngModel)]="searchQuery"
      (ngModelChange)="onSearchInput($event)"
    />
    @if (searchQuery) {
      <button type="button" class="search-clear" (click)="clearSearch()" aria-label="Clear search">
        ✕
      </button>
    } @else {
      <span aria-hidden="true">🔍</span>
    }
  </div>

  <div class="navbar__actions">
    <app-button variant="ghost" (clicked)="themeService.toggleTheme()">
      @if (themeService.theme() === 'light') {
        🌙
      } @else {
        ☀️
      }
    </app-button>

    @if (authService.isLoggedIn()) {
      <a routerLink="/cart" class="cart-link" aria-label="Cart">
        🛒 <span class="cart-count">{{ cartItems.length }}</span>
      </a>
      <app-button variant="outline" (clicked)="logout()">Log Out</app-button>
    } @else {
      <a routerLink="/login" class="btn btn--outline">Log In</a>
      <a routerLink="/signup" class="btn btn--filled">Sign Up</a>
    }
  </div>
</nav>
